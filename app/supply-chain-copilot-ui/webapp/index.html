<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Supply Chain Copilot | NTT DATA Business Solutions</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }

        /* NTT DATA footer bandı */
        #stNttFooter {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: #fff;
            border-top: 3px solid #0078D4;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            z-index: 1;
            box-shadow: 0 -2px 12px rgba(0,100,200,0.10);
            pointer-events: none;
        }

        #stNttFooterLogo {
            height: 28px;
            width: auto;
            border-radius: 6px;
            flex-shrink: 0;
        }

        #stNttFooterText {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        #stNttFooterTitle {
            font-size: 0.78rem;
            font-weight: 700;
            color: #0078D4;
            letter-spacing: 0.01em;
            line-height: 1.2;
        }

        #stNttFooterSub {
            font-size: 0.67rem;
            color: #6b7280;
            letter-spacing: 0.03em;
            line-height: 1.2;
        }

        /* Tema değiştirme butonu */
        #stThemeToggle {
            position: fixed;
            bottom: 44px;
            right: 20px;
            z-index: 9999;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: #0064d9;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.15s;
        }

        }

        #stThemeToggle:hover {
            background: #0058c4;
            transform: scale(1.08);
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.120.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "customer.supplychaincopilot.supplychaincopilotui": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
    <script>
        // Tema tercihini localStorage'dan yükle
        (function () {
            var saved = localStorage.getItem("stTheme") || "sap_horizon";
            document.getElementById("sap-ui-bootstrap")
                    .setAttribute("data-sap-ui-theme", saved);
        })();
    </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="customer.supplychaincopilot.supplychaincopilotui"
        data-id="container"
        data-settings='{"id" : "customer.supplychaincopilot.supplychaincopilotui"}'
        data-handle-validation="true"
    ></div>

    <!-- NTT DATA marka bandı -->
    <div id="stNttFooter">
        <img src="img/nttdata-logo.svg" alt="NTT DATA" id="stNttFooterLogo"/>
        <div id="stNttFooterText">
            <span id="stNttFooterTitle">NTT DATA Business Solutions Turkey</span>
            <span id="stNttFooterSub">CoE Team &nbsp;·&nbsp; Supply Chain Copilot</span>
        </div>
    </div>

    <!-- Tema değiştirme butonu -->
    <button id="stThemeToggle" title="Temayı değiştir">🌙</button>

    <script>
        document.getElementById("stThemeToggle").addEventListener("click", function () {
            var current = sap.ui.getCore
                ? sap.ui.getCore().getConfiguration().getTheme()
                : localStorage.getItem("stTheme") || "sap_horizon";

            var next = current === "sap_horizon" ? "sap_horizon_dark" : "sap_horizon";
            localStorage.setItem("stTheme", next);

            this.textContent = next === "sap_horizon_dark" ? "☀️" : "🌙";

            if (sap && sap.ui && sap.ui.getCore) {
                sap.ui.getCore().applyTheme(next);
            } else {
                location.reload();
            }
        });

        // Sayfa yüklendiğinde butonu güncelle
        window.addEventListener("load", function () {
            var saved = localStorage.getItem("stTheme") || "sap_horizon";
            document.getElementById("stThemeToggle").textContent =
                saved === "sap_horizon_dark" ? "☀️" : "🌙";
        });
    </script>
</body>
</html>
